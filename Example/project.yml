name: ITabBarDemo

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"

packages:
  ITabBar:
    path: ..
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    exactVersion: 4.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  ITabBarDemo:
    type: application
    platform: iOS
    sources:
      - path: ITabBarDemo
    info:
      path: ITabBarDemo/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: 0.3.0
        PRODUCT_BUNDLE_IDENTIFIER: com.ibabyblue.iTabBarDemo
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ITabBar
        product: ITabBar
      - package: Lottie
        product: Lottie

  ITabBarDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ITabBarDemoUITests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: 0.3.0
        PRODUCT_BUNDLE_IDENTIFIER: com.ibabyblue.ITabBarDemoUITests
        TEST_TARGET_NAME: ITabBarDemo
    dependencies:
      - target: ITabBarDemo

schemes:
  ITabBarDemo:
    build:
      targets:
        ITabBarDemo: all
        ITabBarDemoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ITabBarDemoUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
